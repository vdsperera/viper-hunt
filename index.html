<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viper Hunt - Cyberpunk Tactical Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Modern Cyberpunk HUD -->
        <div id="hud" class="hidden">
            <div class="hud-left-group">
                <div class="hud-badge player-badge">
                    <span class="hud-label">PLAYER</span>
                    <span id="hud-player" class="hud-value">---</span>
                </div>
                <div class="hud-badge level-badge">
                    <span class="hud-label">LEVEL</span>
                    <span id="hud-level" class="hud-value">1</span>
                </div>
                <div id="ai-threat-badge" class="hud-badge threat-badge" title="Dynamic AI Threat Level">
                    <span class="hud-label">AI THREAT</span>
                    <span id="hud-threat-level" class="hud-value threat-value" style="color: #00ff88;">🎯 STANDARD</span>
                </div>
            </div>

            <!-- Attack & Punishment Selector HUD Bar for Mode 1 -->
            <div id="attack-selector-hud" class="hidden">
                <div id="attack-buttons-container" class="attack-buttons-list"></div>
            </div>

            <div class="hud-badge score-badge">
                <span class="hud-label">SCORE</span>
                <span id="hud-score" class="hud-value">0</span>
            </div>
        </div>

        <!-- Active Wanted Targets Roster for Mode 1 (Criminal Bounty Mode) -->
        <div id="wanted-roster-hud" class="hidden">
            <div class="roster-header">
                <span class="roster-title">WANTED TARGETS</span>
            </div>
            <div id="wanted-targets-container" class="wanted-targets-list"></div>
        </div>

        <!-- Emotional Question HUD Banner for Mode 3 -->
        <div id="emotional-question-hud" class="hidden">
            <div class="eq-badge">
                <span class="eq-label">EMOTIONAL QUEST</span>
                <span id="eq-question-text" class="eq-value">Loading question...</span>
                <div id="eq-answers-container" class="eq-answers-list"></div>
            </div>
        </div>

        <canvas id="game-canvas" width="1280" height="720"></canvas>

        <!-- Virtual Touch D-Pad for Mobile -->
        <div id="dpad-controls" class="hidden">
            <button id="dpad-up" class="dpad-btn up" aria-label="Up"><span>▲</span></button>
            <div class="dpad-middle-row">
                <button id="dpad-left" class="dpad-btn left" aria-label="Left"><span>◄</span></button>
                <div class="dpad-center-stub"></div>
                <button id="dpad-right" class="dpad-btn right" aria-label="Right"><span>►</span></button>
            </div>
            <button id="dpad-down" class="dpad-btn down" aria-label="Down"><span>▼</span></button>
        </div>

        <!-- Glassmorphism Overlay UI -->
        <div id="overlay-ui" class="overlay">
            <div class="overlay-card">
                <div class="logo-container">
                    <h1 id="overlay-title">VIPER HUNT</h1>
                    <div class="cyber-line"></div>
                </div>
                <p id="overlay-message">Loading Registry...</p>
                
                <div id="profile-section" class="hidden">
                    <!-- Audio Configuration Control Panel -->
                    <div class="audio-config-bar">
                        <div class="audio-toggle-group">
                            <button id="sfx-toggle-btn" class="cyber-btn audio-btn" title="Toggle Sound Effects"><span>🔊 SFX: ON</span></button>
                            <button id="bgm-toggle-btn" class="cyber-btn audio-btn" title="Toggle Background Music"><span>🎵 BGM: ON</span></button>
                            <button id="voice-toggle-btn" class="cyber-btn audio-btn" title="Toggle Tactical Voice Comms"><span>🎙 VOICE: ON</span></button>
                            <button id="log-config-toggle-btn" class="cyber-btn audio-btn off" title="Toggle Criminal Punishment & Capture Log"><span>📋 LOG: OFF</span></button>
                        </div>
                        <div class="audio-sliders-group">
                            <div class="slider-row">
                                <span class="slider-label">SFX</span>
                                <input type="range" id="sfx-volume-slider" min="0" max="1" step="0.05" value="0.8">
                            </div>
                            <div class="slider-row">
                                <span class="slider-label">BGM</span>
                                <input type="range" id="bgm-volume-slider" min="0" max="1" step="0.05" value="0.4">
                            </div>
                            <div class="slider-row track-select-row">
                                <span class="slider-label">TRACK</span>
                                <select id="bgm-track-select" class="track-select">
                                    <option value="neon_chase">🎵 Neon Chase (124 BPM)</option>
                                    <option value="cyber_standoff">⚡ Cyber Standoff (130 BPM)</option>
                                    <option value="shadow_grid">🌌 Shadow Grid (118 BPM)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="profile-card-group">
                        <div class="profile-create">
                            <input type="text" id="new-profile-name" placeholder="Enter player callsign..." maxlength="16" autocomplete="off">
                            <button id="create-profile-btn" class="cyber-btn secondary"><span>+ CREATE</span></button>
                        </div>
                        <div class="profile-select">
                            <select id="profile-dropdown">
                                <option value="">-- Select Callsign --</option>
                            </select>
                        </div>
                        <div class="mode-select">
                            <select id="mode-dropdown">
                                <option value="mode1" selected>Criminal Bounty Mode (Default)</option>
                                <option value="mode2">Treasure Vault Mode</option>
                                <option value="mode3">Emotional Death Quest Mode</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="score-breakdown-container" class="hidden"></div>

                <button id="start-btn" class="cyber-btn primary" disabled><span>START SESSION</span></button>
            </div>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
